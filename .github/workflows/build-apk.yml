name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 22.04 ships a working Android SDK + sdkmanager; ubuntu-latest (24.04) broke
    # android-actions/setup-android (the step that was failing after ~16s).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the action's default install: it tries the obsolete 'tools' package,
          # which no longer exists in the SDK repo and fails (exit 1). We install the
          # packages we actually need in the next step.
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compute version
        id: ver
        run: |
          BASE=0.1.0
          LABEL="b${{ github.run_number }}"
          SHA=$(git rev-parse --short HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${BASE}-${LABEL}" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}-${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Crypto unit tests
        run: gradle :crypto:testDebugUnitTest --stacktrace --no-daemon

      # Reconstruct the signing keystore from a secret (kept out of the repo).
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/cripta-release.keystore
            echo "Keystore restored."
          else
            echo "No KEYSTORE_BASE64 secret set — building with the default debug key."
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: >
          gradle :app:assembleDebug --stacktrace --no-daemon
          -PbuildLabel=${{ steps.ver.outputs.label }}
          -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          DST="cripta-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cripta-${{ steps.ver.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Cripta ${{ steps.ver.outputs.version }}
          body: |
            Build automatica da CI.
            - Versione: ${{ steps.ver.outputs.version }}
            - Commit: ${{ steps.ver.outputs.sha }}
            - Build #${{ github.run_number }}

            APK debug allegato qui sotto. Debug build, non firmata per il Play Store.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: true

      # The in-app updater needs the APK attached to the release. Since build 125 the action above
      # has been creating releases without the asset, so make sure it is there (re-upload if not).
      - name: Ensure APK is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(basename "${{ steps.apk.outputs.path }}")
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$NAME"; then
            echo "APK already attached."
          else
            gh release upload "${{ steps.ver.outputs.tag }}" "${{ steps.apk.outputs.path }}" --repo "${{ github.repository }}" --clobber
            gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$NAME"
          fi
